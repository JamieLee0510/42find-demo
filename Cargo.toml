# 目录语义的机器可读版本。**不另造配置文件**——Rust 生态里这件事就归这儿。
#
# ⚠️ 包名不叫 42find-cli：cargo 对以数字开头的包名有限制，所以包名用 find42-*，
#    目录名与命令名都保持 42find。命令名由 [[bin]] name 决定，见 src/42find-cli/Cargo.toml。
[workspace]
resolver = "3"
members  = [
  "src/42find-cli",   # 入口：命令行界面
  "src/42find-core",  # 能力：功能逻辑
]

[workspace.package]
edition = "2024"
# 代码是 MIT；`find42-core` 里入库的 variants_generated.rs 是 Unihan 数据的衍生物。
# Cargo 的 license 是**整个 package 的**许可，不是「仅代码」，所以必须是复合式——
# 只写 MIT 会对 Cargo 消费者错误声明。完整文本见根目录 `NOTICE`。
license = "MIT AND Unicode-3.0"

# ⚠️ 闸门的牙齿要装两副。先前只 deny 了 clippy 的警告，**rustc 自己的警告一路放行**——
# 于是一段 `ASYM_GROUPS` 死代码在仓里躺了好几轮，编译器每次都在说，
# 而六轮对抗性评审都没提（评审读的是 diff，不是编译输出）。
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# ⚠️ 这两条不在 `all` 里（属 restriction 组），要显式点名。
# issue #7：`println!` 遇写失败**直接 panic** 退 101，`| head` 一接就炸；
# `eprintln!` 同理。改完之后全仓一处都不许再有——但「改完之后」是个人判的事，
# 会随下一次手写复发。放在这里它就成了**编译期规则**，跑在已有的
# `cargo clippy --all-targets` 那道闸里，不用新增脚本、也不用记得跑。
# 输出一律走 `42find-cli` 的 `emit`（写失败经 `is_fatal_write_err` 定退出码）
# 与 `warn!` 宏（诊断，忽略写失败）。
print_stdout = "deny"
print_stderr = "deny"
# `dbg!` 展开成 `eprintln!`，写失败同样 panic，同属 restriction 组、同样不在 `all` 里
# ——刚发现这个盲区就只堵两条，第三条会原样再来一次。
dbg_macro = "deny"
